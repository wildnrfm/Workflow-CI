name: Workflow CI - MLflow Training

on:
  push:
    branches: [main]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn==1.4.2 pandas numpy matplotlib

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local --experiment-name "diabetes-ci"

      - name: Upload model artifact ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifact
          path: |
            mlruns/
            MLProject/artifacts/

      - name: Commit artifacts ke repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/artifacts/ mlruns/ || true
          git diff --staged --quiet || git commit -m "auto: update model artifacts dari CI run"
          git push || true
